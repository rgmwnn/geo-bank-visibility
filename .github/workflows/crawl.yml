name: crawl
on:
  workflow_dispatch:
  push:
    paths: [crawl/request.txt]
permissions:
  contents: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install headless Chromium for JavaScript-built pages
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Fetch cited pages
        run: python -m scripts.crawl
      - name: Derive page facts, brand counts and attribution scores
        run: python -m scripts.derive
      - uses: actions/upload-artifact@v4
        with:
          name: crawl-cache
          path: .cache/crawl
          retention-days: 90
      - name: Commit derived CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/interim/pages.csv data/interim/page_brand_counts.csv data/interim/attribution_scores.csv
          git commit -m "data: crawl results $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
